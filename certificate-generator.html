<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Generator | RV Consulting</title><link rel="stylesheet" href="certificate-generator.css"></head>
<body><main class="generator"><img src="assets/rv-mark-logo.png" alt="RV Consulting" class="logo"><p class="eyebrow">RV CONSULTING</p><h1>Certificate generator</h1><p class="intro">Enter the recipient name and certificate date to download a non-editable PDF certificate.</p><form id="certificateForm"><label>Recipient name<input name="name" required maxlength="80" placeholder="Enter recipient name" autocomplete="name"></label><label>Certificate date<input name="date" type="date" required></label><input name="format" type="hidden" value="pdf"><button type="submit">Generate PDF certificate</button><p id="status" role="status"></p></form></main><script src="certificate-generator.js"></script></body></html>
